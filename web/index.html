<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMS 匿名投票 — 即時結果</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 登入區塊 -->
  <div id="login-section">
    <div class="card">
      <h1>SMS 匿名投票</h1>
      <p class="subtitle">管理者登入後查看即時結果</p>
      <button id="login-btn">使用 Google 帳號登入</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <!-- 驗證中 -->
  <div id="checking-section" class="hidden">
    <div class="card center-card">
      <div class="spinner"></div>
      <p style="margin-top:16px;color:#666">驗證身分中…</p>
    </div>
  </div>

  <!-- 待審核 / 無權限 -->
  <div id="denied-section" class="hidden">
    <div class="card center-card">
      <div id="denied-icon" style="font-size:3rem;margin-bottom:12px">⏳</div>
      <h2 id="denied-title">帳號待審核</h2>
      <p id="denied-msg" class="subtitle">你的帳號尚未獲得管理員核准，請聯絡管理員。</p>
      <button id="denied-logout-btn" style="margin-top:24px">登出</button>
    </div>
  </div>

  <!-- 結果區塊（已核准才顯示） -->
  <div id="results-section" class="hidden">
    <header>
      <h1>SMS 匿名投票 — 即時結果</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <span id="user-role-badge" class="role-badge"></span>
        <button id="admin-panel-btn" class="hidden">👥 帳號管理</button>
        <button id="logout-btn">登出</button>
      </div>
    </header>

    <main>
      <div id="no-polls" class="empty-state">尚無進行中的投票</div>
      <div id="polls-container"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
